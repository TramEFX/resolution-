# DaVinci Resolve default keyboard, mapped onto Resolution command ids.
#
# Key notation: `Mod` = Cmd on macOS, Ctrl on Windows/Linux. `Alt` = Option on macOS.
# Key assignments are functional facts about how Resolve is operated; no Blackmagic files are used.
#
# STATUS: `verified = true` marks a key the DaVinci Resolve 21.1 Reference Manual gives for that
# action (checked 2026-10-14, LOG D-051). The rest are still to check in a real install's
# Keyboard Customization ("DaVinci Resolve" preset): the page keys (the manual says Shift-2 to
# Shift-8 in page order but its list did not survive extraction), Mod+B (the manual gives it as
# Razor, which cuts at the playhead as Split does) and Shift+Backspace (not in the manual).

[meta]
name = "DaVinci Resolve"
resolve_version = "21.1"

# ---- pages ----
[[bind]]
keys = "Shift+2"
command = "page.media"
[[bind]]
keys = "Shift+3"
command = "page.cut"
[[bind]]
keys = "Shift+4"
command = "page.edit"
[[bind]]
keys = "Shift+5"
command = "page.fusion"
[[bind]]
keys = "Shift+6"
command = "page.color"
[[bind]]
keys = "Shift+7"
command = "page.fairlight"
[[bind]]
keys = "Shift+8"
command = "page.deliver"

