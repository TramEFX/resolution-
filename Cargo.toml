[workspace]
resolver = "3"
members = [
    "crates/agent-link",
    "crates/engine-api",
    "crates/filmcraft-adapter",
    "crates/grade",
    "crates/keymap",
    "crates/mcp",
    "crates/playback",
    "apps/resolution-cli",
    "apps/resolution-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# internal
resolution-agent-link = { path = "crates/agent-link" }
resolution-engine-api = { path = "crates/engine-api" }
resolution-filmcraft-adapter = { path = "crates/filmcraft-adapter" }
resolution-grade = { path = "crates/grade" }
resolution-keymap = { path = "crates/keymap" }
resolution-mcp = { path = "crates/mcp" }
resolution-playback = { path = "crates/playback" }

# The engine: FilmCraft via Resolution's private mirror (TramEFX/resolution-filmcraft), pinned to
# a sync point's commit (branch sync/fc-20261013 = storytold/filmcraft@cee1feb + mirror plumbing).
# Move it with scripts/sync-mirror.sh (docs/UPSTREAM.md). Only crates/filmcraft-adapter may depend
# on filmcraft-* crates. Every filmcraft-* line pins the same rev.
filmcraft-engine = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }
# Beyond the session, for playback (LOG D-013, D-014): decoder hints and timing (media, frame), the
# resampler to the device's rate (audio-dsp), the OS hardware decoders (platform).
filmcraft-media = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }
filmcraft-frame = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }
filmcraft-audio-dsp = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }
filmcraft-platform = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }
filmcraft-scopes = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }
filmcraft-geom = { git = "https://github.com/TramEFX/resolution-filmcraft", rev = "29d01cf1298f3c525e112fcb4ccd17fc2183edf2" }

# UI (LOG D-012): the same egui stack as FilmCraft's own UI, so its code is a working reference.
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
rfd = "0.17"

# Playback (LOG D-013): audio output, which is also the playback clock.
cpal = "0.18"

# foundation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

# Upstream's codec hot loops need opt-level 3 even in dev builds; profile settings do not
# carry over from a dependency's workspace, so they are mirrored here.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.filmcraft-h264]
opt-level = 3

[profile.dev.package.filmcraft-h264enc]
opt-level = 3

[profile.dev.package.filmcraft-hevc]
opt-level = 3

[profile.dev.package.filmcraft-prores]
opt-level = 3

[profile.dev.package.filmcraft-dnx]
opt-level = 3

[profile.dev.package.filmcraft-apv]
opt-level = 3

[profile.dev.package.filmcraft-dng]
opt-level = 3

[profile.dev.package.filmcraft-av1]
opt-level = 3

[profile.dev.package.filmcraft-aac]
opt-level = 3

[profile.dev.package.filmcraft-flac]
opt-level = 3

[profile.dev.package.filmcraft-audio-dsp]
opt-level = 3

[profile.dev.package.filmcraft-mxf]
opt-level = 3

[profile.dev.package.filmcraft-opus]
opt-level = 3

[profile.dev.package.filmcraft-vp8]
opt-level = 3

[profile.dev.package.filmcraft-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
